<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sign up | Git</title>
	<style>
		:root { --ink: #1f2328; --muted: #656d76; --line: #d0d7de; --blue: #0969da; --green: #1f883d; --paper: #f6f8fa; }
		* { box-sizing: border-box; }
		body { margin: 0; color: var(--ink); background: var(--paper); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
		.page { min-height: 100vh; padding: 42px 20px; }
		.brand { display: block; width: fit-content; margin: 0 auto 28px; color: var(--ink); font-size: 25px; font-weight: 600; text-decoration: none; }
		.brand-mark { display: inline-block; width: 25px; height: 25px; margin-right: 7px; border: 3px solid var(--ink); border-radius: 50%; vertical-align: -5px; }
		.card { width: min(100%, 460px); margin: 0 auto; padding: 28px; background: white; border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 3px 8px rgba(31,35,40,.06); }
		h1 { margin: 0 0 8px; font-size: 25px; font-weight: 400; }
		.intro { margin: 0 0 26px; color: var(--muted); font-size: 14px; line-height: 1.5; }
		.field { margin-bottom: 20px; }
		label { display: block; margin-bottom: 7px; font-size: 14px; font-weight: 600; }
		input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; color: var(--ink); background: white; font: inherit; font-size: 15px; }
		input:focus { outline: 2px solid #54aeff; outline-offset: -1px; border-color: var(--blue); }
		.hint { margin: 7px 0 0; color: var(--muted); font-size: 12px; line-height: 1.4; }
		.terms { display: flex; gap: 8px; margin: 0 0 20px; color: var(--muted); font-size: 12px; line-height: 1.45; }
		.terms input { width: auto; margin-top: 2px; accent-color: var(--blue); }
		.submit { width: 100%; padding: 10px 16px; border: 1px solid rgba(31,35,40,.15); border-radius: 6px; color: white; background: var(--green); font-size: 15px; font-weight: 600; cursor: pointer; }
		.submit:hover { background: #1a7f37; }
		.success { display: none; margin: 18px 0 0; padding: 12px; border-radius: 6px; color: #1a7f37; background: #dafbe1; font-size: 14px; text-align: center; }
		.login { width: min(100%, 460px); margin: 16px auto; padding: 16px; border: 1px solid var(--line); border-radius: 6px; font-size: 14px; text-align: center; }
		.login a { color: var(--blue); text-decoration: none; }
		.login a:hover { text-decoration: underline; }
		.back { display: block; margin-top: 25px; color: var(--muted); font-size: 13px; text-align: center; text-decoration: none; }
		.back:hover { color: var(--blue); }
	</style>
</head>
<body>
	<main class="page">
		<a class="brand" href="home.html"><span class="brand-mark" aria-hidden="true"></span>Git</a>

		<form class="card" id="signup-form">
			<h1>Create your account</h1>
			<p class="intro">Join Git to build, collaborate, and ship better software.</p>

			<div class="field">
				<label for="username">Username</label>
				<input id="username" name="username" type="text" autocomplete="username" required>
			</div>

			<div class="field">
				<label for="email">Email address</label>
				<input id="email" name="email" type="email" autocomplete="email" required>
			</div>

			<div class="field">
				<label for="password">Password</label>
				<input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
				<p class="hint">Use at least 8 characters with a mix of letters and numbers.</p>
			</div>

			<label class="terms"><input type="checkbox" required><span>By creating an account, you agree to the terms of service and privacy statement.</span></label>
			<button class="submit" type="submit">Create account</button>
			<p class="success" id="success" role="status">Account created successfully!</p>
		</form>

		<p class="login">Already have an account? <a href="login.html">Sign in</a></p>
		<a class="back" href="home.html">&larr; Back to Foodie</a>
	</main>

	<script>
		document.getElementById('signup-form').addEventListener('submit', function (event) {
			event.preventDefault();
			document.getElementById('success').style.display = 'block';
			this.reset();
		});
	</script>
</body>
</html>
